name: canvas-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: canvas-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check Canvas and notify Telegram
        run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANVAS_ACCOUNTS: ${{ secrets.CANVAS_ACCOUNTS }}
          REMIND_HOURS: "24"

      - name: Save state
        run: |
          git config user.name "canvas-bot"
          git config user.email "canvas-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
